##############################
### WINDOWS AND WORKSPACES ###
##############################

# Remove the weird pop-up behavior in VSCode
windowrule = stay_focused on, match:title ^$, match:class ^$
windowrule = opacity 0.8 0.8, match:class ^(code)$

# Make file picker windows floating
windowrule = float on, center on, match:title ^(Open File|Open|Save|Save As|Export|Import|Choose File|Open Folder)$
windowrule = float on, center on, match:class ^(xdg-desktop-portal-gtk|Xdg-desktop-portal-gtk)$
windowrule = border_size 0, match:class ^(xdg-desktop-portal-gtk|Xdg-desktop-portal-gtk)$

# make nmtui windows floating
windowrule = float on, match:class ^(st)$, match:title ^(NetworkManager TUI)$
windowrule = float on, match:class ^(Alacritty|foot|kitty|wezterm)$, match:title ^(nmtui)$
windowrule = size 600 400, match:class ^(Alacritty|foot|kitty|wezterm)$, match:title ^(nmtui)$
windowrule = center on, match:class ^(Alacritty|foot|kitty|wezterm)$, match:title ^(nmtui)$

# make waybar pkg upgrade floating (pacman)
windowrule = float on, center on, match:title ^(pacman)$
windowrule = size 800 600, match:title ^(pacman)$

# make thunar floating
windowrule = float on, center on, match:class ^(thunar)$
windowrule = size 800 600, match:class ^(thunar)$

# Blur swaync layers (layer rules pakai match:namespace)
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window

# Disable borders for swaync window (kalau swaync muncul sebagai window, bukan layer)
windowrule = border_size 0, match:class ^(swaync)$

# Ignore maximize requests from apps
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland (rule klasik, tapi pakai v3)
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Sticky note floating
windowrule = float on, center on, match:class ^sticky-note$
windowrule = size 800 500, match:class ^sticky-note$

# Clipboard edit floating
windowrule = float on, center on, match:class ^clipboard-edit$
windowrule = size 600 300, match:class ^clipboard-edit$

# Game idle inhibit
windowrule = idle_inhibit always, match:title ^Hades$
